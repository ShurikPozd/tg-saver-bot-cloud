# Тесты на каждый push и PR. Render можно настроить «деплоить только после
# успешных проверок» (Settings → Auto-Deploy → After CI Checks Pass) — тогда
# сломанный код просто не доедет до бота.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Зависимости
        run: pip install -r requirements.txt
      - name: Синтаксис всех модулей
        run: python -m compileall -q .
      - name: Тесты
        run: python -m unittest discover -s tests -v
